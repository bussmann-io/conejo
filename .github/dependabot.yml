version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /conejo
      - /conejo-runner
    schedule:
      interval: daily
    ignore:
      - dependency-name: data.forgejo.org/forgejo/forgejo
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
