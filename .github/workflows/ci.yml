name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck conejo/conejo.sh conejo-runner/conejo-runner.sh test/e2e.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build images
        run: |
          docker build -t conejo:test conejo
          docker build -t conejo-runner:test conejo-runner

      - name: Run end-to-end tests
        run: test/e2e.sh conejo:test conejo-runner:test

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: conejo
            description: Forgejo for bunny.net Magic Containers, with hourly encrypted backups to S3
          - image: conejo-runner
            description: Forgejo Actions runner for bunny.net Magic Containers
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read upstream version
        id: upstream
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "version=$(sed -nE 's/^FROM [^:]+:([0-9][0-9.]*).*/\1/p' "$IMAGE/Dockerfile")" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT AND GPL-3.0-or-later

      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
